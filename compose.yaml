services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan serve --host=0.0.0.0 --port=8000
        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - .:/var/www/html
        networks:
            - veloria
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    vite:
        build:
            context: .
            dockerfile: Dockerfile
        command: npm run dev -- --host=0.0.0.0
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html
        networks:
            - veloria

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan horizon
        volumes:
            - .:/var/www/html
        networks:
            - veloria
        depends_on:
            - redis

    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan reverb:start --host=0.0.0.0
        ports:
            - '${REVERB_SERVER_PORT:-8080}:8080'
        volumes:
            - .:/var/www/html
        networks:
            - veloria
        depends_on:
            - redis

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'veloria-mysql:/var/lib/mysql'
            - './docker/mysql:/docker-entrypoint-initdb.d'
        networks:
            - veloria
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'veloria-redis:/data'
        networks:
            - veloria
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    meilisearch:
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'veloria-meilisearch:/meili_data'
        networks:
            - veloria
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - veloria

    minio:
        image: 'minio/minio:latest'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: '${AWS_ACCESS_KEY_ID:-veloria}'
            MINIO_ROOT_PASSWORD: '${AWS_SECRET_ACCESS_KEY:-password}'
        volumes:
            - 'veloria-minio:/data'
        command: 'minio server /data --console-address ":8900"'
        networks:
            - veloria
        healthcheck:
            test:
                - CMD
                - mc
                - ready
                - local
            retries: 3
            timeout: 5s

networks:
    veloria:
        driver: bridge

volumes:
    veloria-mysql:
        driver: local
    veloria-redis:
        driver: local
    veloria-meilisearch:
        driver: local
    veloria-minio:
        driver: local
